[project]
name = "customer-assist"
version = "0.1.0"
description = "Customer Assist — agentic orchestration over Tally/MongoDB"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2.11",
    "openai>=3.0.0",
    "pydantic>=2.9",
    "pymongo>=4.10",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
